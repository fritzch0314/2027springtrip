<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="關東家族旅行">
<title>2027 日本關東 10天9夜 家族旅行助理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗻</text></svg>">
<style>
:root{
  --fs:17px;
  --bg:#f6f3ee; --surface:#ffffff; --surface2:#f0ece4; --text:#1d2433; --muted:#5a6272;
  --line:#ddd6ca; --primary:#1f3a5f; --primary-ink:#ffffff; --accent:#c8553d;
  --c-flight:#6b4fbb; --c-transit:#2f6f9f; --c-food:#c26a12; --c-hotel:#3d7d4a; --c-sight:#b23a48; --c-event:#a1307f;
  --tip-bg:#fff6dd; --tip-line:#e2b33c; --warn-bg:#fde8e4; --warn-line:#d9534f;
  --now:#0f8a5f; --shadow:0 2px 10px rgba(30,40,60,.08);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#12161d; --surface:#1b212b; --surface2:#242c38; --text:#eef1f6; --muted:#a9b2c1;
  --line:#323c4b; --primary:#8fb8ff; --primary-ink:#0d1420; --accent:#ff8a70;
  --c-flight:#b9a3ff; --c-transit:#7cc0ff; --c-food:#ffb366; --c-hotel:#86d897; --c-sight:#ff8f9d; --c-event:#f39be0;
  --tip-bg:#3a3218; --tip-line:#c9a23a; --warn-bg:#40221f; --warn-line:#ff7b72;
  --now:#3ddc97; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.65;padding-bottom:calc(min(4.6rem,90px) + env(safe-area-inset-bottom))}
a{color:var(--primary)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--primary);color:var(--primary-ink);
  padding:calc(.55rem + env(safe-area-inset-top)) 1rem .55rem;box-shadow:var(--shadow)}
.top-row{display:flex;align-items:center;gap:.6rem;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.05rem;flex:1 1 auto;min-width:0}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .logo{font-size:1.4rem}
.tools{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.fontbar{display:flex;align-items:center;background:rgba(255,255,255,.14);border-radius:999px;padding:.15rem}
[data-theme="dark"] .fontbar{background:rgba(0,0,0,.18)}
.fontbar .lbl{font-size:.8rem;padding:0 .45rem 0 .55rem;opacity:.9;white-space:nowrap}
.fontbar button{border:0;background:transparent;color:inherit;border-radius:999px;min-width:2.2rem;height:2.2rem;
  display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;padding:0 .35rem}
.fontbar button[aria-pressed="true"]{background:var(--primary-ink);color:var(--primary)}
.iconbtn{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:999px;height:2.4rem;min-width:2.4rem;padding:0 .7rem;font-size:1rem}
[data-theme="dark"] .iconbtn{background:rgba(0,0,0,.18)}
nav.tabs{display:none}

/* ---------- Bottom nav (mobile) ---------- */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.06)}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:.05rem;
  padding:.3rem 0;font-size:min(.78rem,16px);color:var(--muted);border-radius:10px;white-space:nowrap}
nav.bottom button .ic{font-size:min(1.35rem,26px);line-height:1.2}
nav.bottom button[aria-current="page"]{color:var(--primary);font-weight:700;background:var(--surface2)}

main{max-width:1200px;margin:0 auto;padding:1rem}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Banner ---------- */
.banner{background:linear-gradient(135deg,var(--accent),#e09f3e);color:#fff;border-radius:var(--radius);
  padding:.9rem 1.1rem;margin-bottom:1rem;display:flex;align-items:center;gap:.8rem;box-shadow:var(--shadow)}
[data-theme="dark"] .banner{background:linear-gradient(135deg,#7a2f22,#7a5a1f)}
.banner .big{font-size:2rem}
.banner b{font-size:1.15rem}

/* ---------- Day picker ---------- */
.daywrap{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
.daywrap > *{min-width:0}
.daypicker{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem .1rem .6rem;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.daypicker::-webkit-scrollbar{height:6px}.daypicker::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.daychip{scroll-snap-align:start;flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:12px;
  padding:.4rem .7rem;text-align:left;min-width:6.4rem;position:relative}
.daychip .dn{font-weight:800;font-size:.95rem;display:block}
.daychip .dd{font-size:.8rem;color:var(--muted);display:block;white-space:nowrap}
.daychip[aria-selected="true"]{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.daychip[aria-selected="true"] .dd{color:inherit;opacity:.9}
.daychip .todaydot{position:absolute;top:.35rem;right:.4rem;background:var(--now);color:#fff;font-size:.65rem;border-radius:6px;padding:0 .3rem}

.dayhead{background:var(--surface);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow);border:1px solid var(--line)}
.dayhead .row1{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;padding:.05rem .65rem;font-size:.82rem;font-weight:700;background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.pill.holiday{background:#c8102e;color:#fff;border-color:#c8102e}
.pill.area{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.dayhead h2{margin:.35rem 0 .2rem;font-size:1.45rem;line-height:1.35}
.dayhead .date{color:var(--muted);font-size:.95rem}
.daynav{display:flex;gap:.5rem;margin-top:.7rem}
.daynav button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:.5rem;font-weight:700}
.daynav button:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}

/* ---------- Filter ---------- */
.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:.2rem 0 .1rem}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.25rem .8rem;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ---------- Timeline ---------- */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:1.35rem;top:.5rem;bottom:.5rem;width:3px;background:var(--line);border-radius:2px}
.ev{position:relative;padding-left:3.3rem;margin:0 0 .75rem}
.ev .dot{position:absolute;left:.3rem;top:.55rem;width:2.15rem;height:2.15rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;background:var(--surface);border:3px solid var(--cat);z-index:1}
.ev .card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cat);border-radius:12px;padding:.6rem .85rem;box-shadow:var(--shadow)}
.ev .time{font-weight:800;color:var(--cat);font-size:1rem;letter-spacing:.02em;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.ev .cat{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 .35rem}
.ev .txt{font-size:1.04rem;margin-top:.1rem;word-break:break-word}
.ev.transit .txt{color:var(--muted)}
.ev.flight{--cat:var(--c-flight)} .ev.transit{--cat:var(--c-transit)} .ev.food{--cat:var(--c-food)}
.ev.hotel{--cat:var(--c-hotel)} .ev.sight{--cat:var(--c-sight)} .ev.event{--cat:var(--c-event)}
.ev.transit .card{background:var(--surface2);box-shadow:none}
.ev.past .card{opacity:.6}
.ev.now .card{outline:3px solid var(--now);outline-offset:1px}
.ev .nowtag{background:var(--now);color:#fff;border-radius:6px;padding:0 .4rem;font-size:.75rem}
a.place{display:inline-flex;align-items:center;gap:.1rem;font-weight:700;color:var(--cat);text-decoration:none;border-bottom:2px dotted currentColor;padding:0 .05rem}
.ev.transit a.place{color:var(--c-transit)}
a.place:hover{background:var(--surface2)}
.tip{margin-top:.45rem;background:var(--tip-bg);border-left:4px solid var(--tip-line);border-radius:8px;padding:.4rem .6rem;font-size:.95rem}
.tip.warn{background:var(--warn-bg);border-color:var(--warn-line)}

.side-cards{display:grid;gap:1rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1.1rem;box-shadow:var(--shadow)}
.box h3{margin:0 0 .45rem;font-size:1.1rem;display:flex;align-items:center;gap:.4rem}
.box ul{margin:0;padding-left:1.2rem}
.box li{margin:.25rem 0}
.hotelname{font-weight:800;font-size:1.08rem}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:.4rem .8rem;
  font-weight:700;text-decoration:none;color:var(--text);margin-top:.4rem}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ---------- Overview ---------- */
.searchbox{display:flex;gap:.5rem;margin-bottom:1rem}
.searchbox input{flex:1;font:inherit;padding:.65rem .9rem;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:1rem}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;box-shadow:var(--shadow);text-align:left;width:100%;
  display:flex;flex-direction:column;gap:.35rem;border-top:6px solid var(--areac,var(--primary))}
.dcard:hover{transform:translateY(-2px);transition:.15s}
.dcard .h{display:flex;justify-content:space-between;align-items:center;gap:.4rem;flex-wrap:wrap}
.dcard .n{font-weight:800;font-size:1.05rem}
.dcard .ti{font-weight:800;font-size:1.12rem;line-height:1.35}
.dcard .hl{color:var(--muted);font-size:.92rem}
.dcard .ho{font-size:.88rem;border-top:1px dashed var(--line);padding-top:.35rem}
.results .r{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .85rem;margin-bottom:.5rem;width:100%;text-align:left;display:block}
.results .r small{color:var(--muted);font-weight:700}
mark{background:#ffe066;color:#000;border-radius:3px;padding:0 .1rem}

/* ---------- Checklist ---------- */
.progress{height:.8rem;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress > div{height:100%;background:var(--now);width:0;transition:width .3s}
.check{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem .2rem;border-bottom:1px dashed var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:1.45rem;height:1.45rem;margin-top:.15rem;flex:0 0 auto;accent-color:var(--now)}
.check.done span{text-decoration:line-through;color:var(--muted)}

/* ---------- Info ---------- */
table.info{width:100%;border-collapse:collapse;font-size:.95rem}
table.info th,table.info td{border-bottom:1px solid var(--line);padding:.45rem .3rem;text-align:left;vertical-align:top}
table.info th{color:var(--muted);font-weight:700;white-space:nowrap}
.tel{font-size:1.5rem;font-weight:800;text-decoration:none}
.sectitle{font-size:1.3rem;margin:.2rem 0 .8rem}
.foot{color:var(--muted);font-size:.82rem;text-align:center;margin:2rem 0 1rem}

/* ---------- Desktop ---------- */
@media (min-width:900px){
  body{padding-bottom:0}
  nav.bottom{display:none}
  nav.tabs{display:flex;gap:.25rem;max-width:1200px;margin:.45rem auto 0}
  nav.tabs button{border:0;background:transparent;color:inherit;padding:.4rem .9rem;border-radius:10px 10px 0 0;font-weight:700;opacity:.85}
  nav.tabs button[aria-current="page"]{background:var(--bg);color:var(--text);opacity:1}
  header.top{padding-bottom:0}
  .daywrap{grid-template-columns:minmax(0,1fr) 22rem;align-items:start}
  .daywrap .full{grid-column:1 / -1}
  .side-cards{position:sticky;top:8.5rem}
}
@media (max-width:520px){
  .brand span.t{font-size:.95rem}
  .fontbar .lbl{display:none}
  .tools{width:100%;justify-content:space-between}
}
@media print{
  header.top,nav,.daynav,.filters,.daypicker,.banner,.searchbox{display:none!important}
  body{background:#fff;padding:0}
  .view{display:block!important}
  .ev .card,.box,.dayhead{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">

<main>

  <section class="view" id="v-day" aria-label="每日行程">

  <!-- 總覽 -->

    <div class="searchbox">
      <label class="sr-only" for="q">搜尋行程</label>

    <div class="results" id="results"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 住宿 -->
  <section class="view" id="v-hotel" aria-label="住宿">

    <div class="grid" id="hotels"></div>
  </section>

  <!-- 清單 -->
  <section class="view" id="v-check" aria-label="準備清單">
    <h2 class="sectitle">📝 準備事項清單</h2>
    <div class="box" style="margin-bottom:1rem">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap">
        <b id="progtxt">完成 0 / 0</b>
        <button class="btn" id="resetChk" style="margin:0">↺ 全部重設</button>

      <small style="color:var(--muted)">勾選狀態會自動儲存在這台裝置上。</small>
    </div>
    <div class="grid" id="checks"></div>
  </section>

  <!-- 資訊 -->
  <section class="view" id="v-info" aria-label="實用資訊">
    <h2 class="sectitle">ℹ️ 實用資訊</h2>
    <div class="grid" id="info"></div>
  </section>

  <p class="foot">資料來源：2027日本關東10天9夜家族旅行行程表 ・ 行程時間皆為日本當地時間（桃園出發段為台灣時間）</p>
</main>

/* =========================================================
   工具函式
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mapUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('kanto27_'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('kanto27_'+k, JSON.stringify(v)); }catch(e){} }
};
const TYPES = {
  flight:{label:'航班', ic:'✈️'}, transit:{label:'交通', ic:'🚆'}, sight:{label:'景點', ic:'📍'},
  food:{label:'餐食', ic:'🍽️'}, hotel:{label:'住宿', ic:'🏨'}, event:{label:'活動', ic:'✨'}
};
const LEAD = [['✈️','flight','✈️'],['🛬','flight','🛬'],['🚆','transit','🚆'],['🚃','transit','🚃'],['🚌','transit','🚌'],
              ['🚗','transit','🚗'],['🚶','transit','🚶'],['🍽️','food','🍽️'],['✨','event','🎆'],['📍','sight','📍']];
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };

function parseItem([time, raw]){
  let text = raw.trim(), type = 'sight', icon = '📍';
  for (const [e,t,i] of LEAD){ if (text.startsWith(e)){ type=t; icon=i; text=text.slice(e.length).trim(); break; } }
  if (/Check-in|入住/.test(text)){ type='hotel'; icon='🏨'; }
  // 分離提醒
  const tips = [];
  const m = text.match(/(⚠️|💡)/);
  if (m){ const rest = text.slice(m.index); text = text.slice(0, m.index).trim();
    rest.split(/(?=⚠️|💡)/).forEach(s => { s=s.trim(); if(s) tips.push({warn:s.startsWith('⚠️'), text:s.replace(/^(⚠️|💡)\s*/,'')}); }); }
  const times = (time.match(/\d{1,2}:\d{2}/g) || []);
  const places = [...text.matchAll(/【(.+?)】/g)].map(x => x[1]);
  return {time, start: times[0] ? toMin(times[0]) : null, end: times[1] ? toMin(times[1]) : null, type, icon, text, tips, places};
}
DAYS.forEach((d,i) => { d.idx=i; d.parsed = d.items.map(parseItem); });

function renderText(text, day){
  return esc(text).replace(/【(.+?)】/g, (_, name) =>
    `<a class="place" href="${mapUrl(name + ' ' + day.map)}" target="_blank" rel="noopener" title="在 Google 地圖開啟：${name}">${name}</a>`);
}
function fmtDate(d){ const [y,m,dd] = d.date.split('-'); return `${+m}/${+dd}（${d.wd}）`; }

/* ---------- 日本時間 ---------- */
function jstNow(){
  const n = new Date(Date.now() + 9*3600e3);
  return {date: n.toISOString().slice(0,10), min: n.getUTCHours()*60 + n.getUTCMinutes(), ts: n};
}
function todayIdx(){ const t = jstNow().date; return DAYS.findIndex(d => d.date === t); }

const FS = [15, 17, 20, 24, 28];
function setFont(i){
  document.documentElement.style.setProperty('--fs', FS[i] + 'px');
  document.querySelectorAll('.fontbar button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.fs === i));
  store.set('fs', i);
}
document.querySelectorAll('.fontbar button').forEach(b => b.addEventListener('click', () => setFont(+b.dataset.fs)));
setFont(store.get('fs', 1));

function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('#themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#12161d' : '#1f3a5f';
  store.set('theme', t);
}
$('#themeBtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

const VIEWS = [['day','📅','每日行程'],['overview','🗺️','總覽'],['hotel','🏨','住宿'],['check','📝','清單'],['info','ℹ️','資訊']];
function buildNav(){
  const html = VIEWS.map(([id,ic,lb]) => `<button data-view="${id}"><span class="ic" aria-hidden="true">${ic}</span><span>${lb}</span></button>`).join('');
  document.querySelector('nav.bottom').innerHTML = html;
  document.querySelector('nav.tabs').innerHTML = VIEWS.map(([id,ic,lb]) => `<button data-view="${id}">${ic} ${lb}</button>`).join('');
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
}
function go(view, push=true){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-'+view));
  document.querySelectorAll('[data-view]').forEach(b => b.dataset.view === view ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  if (push) history.replaceState(null, '', '#' + view + (view==='day' ? '-' + (state.day+1) : ''));
  window.scrollTo({top:0});
}

function buildPicker(){

  $('#daypicker').innerHTML = DAYS.map((d,i) => `
    <button class="daychip" role="tab" data-i="${i}" aria-selected="${i===state.day}" aria-label="Day ${i+1} ${fmtDate(d)} ${d.title}">
      ${i===ti ? '<span class="todaydot">今天</span>' : ''}
      <span class="dn">Day ${i+1}</span>
      <span class="dd">${fmtDate(d)}${d.tag ? ' ' + d.tag : ''}</span>
    </button>`).join('');
  $('#daypicker').querySelectorAll('.daychip').forEach(b => b.addEventListener('click', () => selectDay(+b.dataset.i)));
}

function selectDay(i, scroll=true){
  state.day = Math.max(0, Math.min(DAYS.length-1, i));
  store.set('day', state.day);
  $('#daypicker').querySelectorAll('.daychip').forEach(b => b.setAttribute('aria-selected', +b.dataset.i === state.day));
  const chip = $('#daypicker').querySelector(`[data-i="${state.day}"]`);
  if (chip && scroll) centerChip(chip, true);
  renderDay();
  history.replaceState(null, '', '#day-' + (state.day+1));
}

function renderDay(){
  const d = DAYS[state.day];
  const counts = {};
  d.parsed.forEach(p => counts[p.type] = (counts[p.type]||0) + 1);
  $('#dayhead').innerHTML = `
    <div class="row1">
      <span class="pill area">Day ${state.day+1}</span>
      <span class="pill">📍 ${esc(d.area)}</span>
      ${d.tag ? `<span class="pill holiday">🧧 ${d.tag}</span>` : ''}
    </div>
    <h2>${esc(d.title)}</h2>
    <div class="date">2027年${fmtDate(d)}</div>
    <div class="stats">${Object.keys(TYPES).filter(k=>counts[k]).map(k => `<span class="pill">${TYPES[k].ic} ${TYPES[k].label} ${counts[k]}</span>`).join('')}</div>
    <div class="daynav">
      <button id="prevDay" ${state.day===0?'disabled':''} aria-label="前一天">◀ 前一天</button>
      <button id="nextDay" ${state.day===DAYS.length-1?'disabled':''} aria-label="後一天">後一天 ▶</button>
    </div>`;
  $('#prevDay').onclick = () => selectDay(state.day-1);
  $('#nextDay').onclick = () => selectDay(state.day+1);

  // 篩選
  const fl = [['all','全部'], ['sight','📍 景點'], ['transit','🚆 交通'], ['food','🍽️ 餐食']];
  $('#filters').innerHTML = fl.map(([k,l]) => `<button data-f="${k}" aria-pressed="${state.filter===k}">${l}</button>`).join('');
  $('#filters').querySelectorAll('button').forEach(b => b.onclick = () => { state.filter = b.dataset.f; renderDay(); });

  // 時間軸
  const isToday = jstNow().date === d.date, nowMin = jstNow().min;
  let nowIdx = -1;
  if (isToday){
    d.parsed.forEach((p,i) => {
      if (p.start === null) return;
      const nextStart = d.parsed.slice(i+1).find(x => x.start !== null)?.start ?? p.start + 60;
      const end = p.end ?? nextStart;
      if (nowMin >= p.start && nowMin < Math.max(end, p.start + 1)) nowIdx = i;
    });
  }
  const list = d.parsed.map((p,i) => ({p,i})).filter(({p}) => state.filter==='all' || p.type===state.filter ||
     (state.filter==='transit' && p.type==='flight') || (state.filter==='sight' && (p.type==='event' || p.type==='hotel')));
  $('#timeline').innerHTML = list.map(({p,i}) => {
    const past = isToday && p.start !== null && i < nowIdx && nowIdx >= 0;
    return `<li class="ev ${p.type} ${i===nowIdx?'now':''} ${past?'past':''}">
      <span class="dot" aria-hidden="true">${p.icon}</span>
      <div class="card">
        <div class="time">${esc(p.time.replace('-', ' – '))} <span class="cat">${TYPES[p.type].label}</span>${i===nowIdx?'<span class="nowtag">進行中</span>':''}</div>
        <div class="txt">${renderText(p.text, d)}</div>
        ${p.tips.map(t => `<div class="tip ${t.warn?'warn':''}">${t.warn?'⚠️ 注意：':'💡 小提醒：'}${esc(t.text)}</div>`).join('')}
      </div></li>`;
  }).join('') || '<li style="color:var(--muted);padding:1rem">此類別今天沒有項目</li>';

  // 側欄
  let side = '';
  if (d.hotel){
    side += `<div class="box"><h3>🏨 今晚住宿</h3>
      <div class="hotelname">${esc(d.hotel)}</div><div style="color:var(--muted)">${esc(d.night)}</div>
      <a class="btn primary" href="${mapUrl(d.hotel)}" target="_blank" rel="noopener">🗺️ 開啟地圖導航</a></div>`;
  } else {
    side += `<div class="box"><h3>🏠 回到溫暖的家</h3><div>旅程結束，一路平安！</div></div>`;
  }
  if (d.prep.length){
    side += `<div class="box"><h3>📝 今晚準備事項</h3><ul>${d.prep.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <button class="btn" onclick="go('check')">前往清單勾選 →</button></div>`;
  }
  const spots = [...new Set(d.parsed.filter(p => p.type==='sight'||p.type==='event'||p.type==='hotel').flatMap(p => p.places))];
  if (spots.length){
    side += `<div class="box"><h3>🗺️ 今日地點快速導航</h3><ul>${spots.map(s =>
      `<li><a href="${mapUrl(s + ' ' + d.map)}" target="_blank" rel="noopener">${esc(s)}</a></li>`).join('')}</ul></div>`;
  }
  $('#side').innerHTML = side;
}

// 滑動切換日期
(() => {
  let sx=0, sy=0;
  const el = $('#timeline');
  el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) selectDay(state.day + (dx < 0 ? 1 : -1));
  }, {passive:true});
})();

/* =========================================================
   橫幅（倒數 / 今日進行中）
   ========================================================= */
function renderBanner(){
  const now = jstNow(), ti = todayIdx();
  const start = Date.UTC(2027,1,1), today = Date.UTC(...now.date.split('-').map((v,i)=> i===1 ? v-1 : +v));
  let html = '';
  if (today < start){
    const days = Math.round((start - today) / 864e5);
    html = `<div class="banner"><span class="big">🧳</span><div><b>距離出發還有 ${days} 天！</b><br>2027/2/1（一）05:30 出發前往桃園機場 T2</div></div>`;
  } else if (ti >= 0){
    const d = DAYS[ti];
    const next = d.parsed.find(p => p.start !== null && p.start > now.min);
    html = `<div class="banner"><span class="big">📍</span><div><b>今天是 Day ${ti+1}：${esc(d.title)}</b><br>${next ? `下一站 ${esc(next.time.split(/[-或]/)[0].trim())}：${esc(next.text.replace(/[【】「」]/g,''))}` : '今天的行程已完成，好好休息！'}</div></div>`;
  }
  $('#banner').innerHTML = html;
}

/* =========================================================
   總覽 + 搜尋
   ========================================================= */
function renderOverview(){
  $('#grid').innerHTML = DAYS.map((d,i) => {
    const hl = [...new Set(d.parsed.filter(p => p.type==='sight'||p.type==='event').flatMap(p => p.places))].slice(0,5);
    return `<button class="dcard" style="--areac:${d.color}" data-i="${i}">
      <div class="h"><span class="n">Day ${i+1}・${fmtDate(d)}</span>${d.tag?`<span class="pill holiday">🧧 ${d.tag}</span>`:''}</div>
      <div class="ti">${esc(d.title)}</div>
      <div class="hl">${hl.length ? '✨ ' + hl.map(esc).join('、') : ''}</div>
      <div class="ho">${d.hotel ? '🏨 ' + esc(d.hotel) : '🏠 返回台灣'}</div>
    </button>`;
  }).join('');
  $('#grid').querySelectorAll('.dcard').forEach(b => b.onclick = () => { go('day'); selectDay(+b.dataset.i); });
}
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim();
  if (!q){ $('#results').innerHTML=''; $('#grid').style.display=''; return; }
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  const hits = [];
  DAYS.forEach((d,i) => d.parsed.forEach(p => { if (re.test(p.text + ' ' + p.tips.map(t=>t.text).join(' '))) hits.push({d,i,p}); re.lastIndex=0; }));
  $('#grid').style.display = 'none';
  $('#results').innerHTML = `<p><b>找到 ${hits.length} 筆</b></p>` + hits.map(({d,i,p}) =>
    `<button class="r" data-i="${i}"><small>Day ${i+1}・${fmtDate(d)}・${esc(p.time)}</small><br>${p.icon} ${esc(p.text.replace(/[【】]/g,'')).replace(re, m => `<mark>${m}</mark>`)}</button>`).join('');
  $('#results').querySelectorAll('.r').forEach(b => b.onclick = () => { go('day'); selectDay(+b.dataset.i); });
});

/* =========================================================
   住宿
   ========================================================= */
function renderHotels(){
  $('#hotels').innerHTML = HOTELS.map(h => `
    <div class="box"><h3>🏨 ${esc(h.nights)}</h3>
      <div class="hotelname">${esc(h.name)}</div>
      <table class="info"><tr><th>日期</th><td>${esc(h.dates)}</td></tr><tr><th>地區</th><td>${esc(h.area)}</td></tr><tr><th>備註</th><td>${esc(h.note)}</td></tr></table>
      <a class="btn primary" href="${mapUrl(h.name)}" target="_blank" rel="noopener">🗺️ Google 地圖</a>
    </div>`).join('');
}

/* =========================================================
   清單
   ========================================================= */
function renderChecks(){
  const done = store.get('chk', {});
  const groups = DAYS.filter(d => d.prep.length).map(d => ({title:`Day ${d.idx+1}・${fmtDate(d)} 晚上`, items:d.prep.map((t,j) => ({id:`d${d.idx}-${j}`, t}))}));
  groups.push({title:'🎒 建議攜帶物品', items:PACKING.map((t,j) => ({id:`p${j}`, t}))});
  $('#checks').innerHTML = groups.map(g => `<div class="box"><h3>${esc(g.title)}</h3>${g.items.map(it =>
    `<label class="check ${done[it.id]?'done':''}"><input type="checkbox" data-id="${it.id}" ${done[it.id]?'checked':''}><span>${esc(it.t)}</span></label>`).join('')}</div>`).join('');
  const total = groups.reduce((a,g) => a + g.items.length, 0);
  const upd = () => { const c = Object.values(store.get('chk', {})).filter(Boolean).length;
    $('#progtxt').textContent = `完成 ${c} / ${total}`; $('#progbar').style.width = (c/total*100) + '%'; };
  $('#checks').querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const s = store.get('chk', {}); s[inp.dataset.id] = inp.checked; store.set('chk', s);
    inp.closest('.check').classList.toggle('done', inp.checked); upd(); });
  upd();
}
$('#resetChk').onclick = () => { if (confirm('確定要清除所有勾選嗎？')){ store.set('chk', {}); renderChecks(); } };

/* =========================================================

      <tr><th>去程</th><td><b>BR198</b>　2/1（一）<br>08:50 桃園 T2 → 12:55 成田 T1<br><small>06:30 前抵達長榮櫃檯報到</small></td></tr>
      <tr><th>回程</th><td><b>BR197</b>　2/10（三）<br>14:00 成田 T1 → 17:05 桃園 T2</td></tr>

/* =========================================================
   啟動
   ========================================================= */
buildNav();
const ti = todayIdx();
state.day = ti >= 0 ? ti : store.get('day', 0);
const hash = location.hash.slice(1);
const hm = hash.match(/^day-(\d+)$/);
if (hm) state.day = Math.min(9, Math.max(0, +hm[1]-1));
buildPicker(); renderDay(); renderOverview(); renderHotels(); renderChecks(); renderInfo(); renderBanner();
go(VIEWS.some(v => v[0] === hash) ? hash : 'day', false);
function centerChip(chip, smooth){
  const p = $('#daypicker');
  p.scrollTo({left: chip.offsetLeft - p.offsetLeft - (p.clientWidth - chip.offsetWidth)/2, behavior: smooth ? 'smooth' : 'auto'});
}
setTimeout(() => { const c = $('#daypicker .daychip[aria-selected="true"]'); if (c) centerChip(c, false); }, 60);
setInterval(() => { renderBanner(); if (todayIdx() === state.day) renderDay(); }, 60000);
</script>
